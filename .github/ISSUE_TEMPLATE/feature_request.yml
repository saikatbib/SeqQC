name: Feature request
description: Propose an offline SeqQC capability or scientific method.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Scientific or security evidence
      description: Include method references, thresholds, validation data, or threat considerations when relevant.

