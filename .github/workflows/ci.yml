name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm desktop:build
      - run: pnpm generate:sbom
      - uses: actions/upload-artifact@v4
        with:
          name: seqqc-sbom
          path: artifacts/sbom/seqqc.cdx.json

  native-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf perl
      - name: Install Windows Perl prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl --no-progress -y
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build
      - run: cargo test --workspace --locked
      - name: Verify native shell dependency boundary
        shell: pwsh
        run: |
          $tree = cargo tree --package seqqc-native-desktop --locked --edges normal --prefix none --format '{p}'
          $forbidden = @('tauri ', 'webview2-com ', 'reqwest ', 'hyper ', 'ureq ', 'curl ', 'webbrowser ', 'tokio-tungstenite ')
          foreach ($package in $forbidden) {
            if ($tree | Select-String -SimpleMatch $package) {
              throw "Forbidden native-shell dependency detected: $package"
            }
          }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  milestone-one-qualification:
    name: M1 qualification (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux graphical and trace prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config perl xvfb libgl1-mesa-dri libegl1 libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev libxrandr-dev libxi-dev strace
      - name: Verify process-family attribution
        if: runner.os != 'Windows'
        run: bash tools/test-process-family.sh
      - name: Windows Perl prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl --no-progress -y
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo build --release --locked --package seqqc-native-desktop --features qualification
      - run: cargo clippy --locked --package seqqc-native-desktop --all-targets --features qualification -- -D warnings
      - name: Pinned Windows CI-only software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.5-release-msvc.7z'
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa3d-qualification'
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.5/mesa3d-26.2.5-release-msvc.7z'
          $expected = '997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Mesa test-driver archive digest mismatch.' }
          & 7z x $archive "-o$mesaRoot" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $mesaRoot 'x64/opengl32.dll'))) { throw 'Missing test OpenGL library.' }
          if (-not (Test-Path -LiteralPath (Join-Path $mesaRoot 'x64/libgallium_wgl.dll'))) { throw 'Missing test Gallium library.' }
          Copy-Item -Path (Join-Path $mesaRoot 'x64/*.dll') -Destination target/release
          'GALLIUM_DRIVER=llvmpipe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'LIBGL_ALWAYS_SOFTWARE=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path target/qualification/visual -Force | Out-Null
          @{ scope = 'CI-only software graphics; never packaged'; version = '26.2.5'; source = $url; archive_sha256 = $actual; libraries = @(Get-ChildItem -Path (Join-Path $mesaRoot 'x64/*.dll') | ForEach-Object { @{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } }) } | ConvertTo-Json -Depth 5 | Set-Content target/qualification/visual/test-driver.json
      - name: Native screenshot matrix (Windows)
        if: runner.os == 'Windows'
        run: node tools/qualify-native.mjs --binary target/release/seqqc-native-desktop.exe --output target/qualification/visual
      - name: Native screenshot matrix (macOS)
        if: runner.os == 'macOS'
        run: node tools/qualify-native.mjs --binary target/release/seqqc-native-desktop --output target/qualification/visual
      - name: Native screenshot and syscall matrix (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tools/qualify-native.mjs --binary target/release/seqqc-native-desktop --output target/qualification/visual
      - name: Sustained synthetic runtime observation
        shell: pwsh
        run: |
          $env:SEQQC_QA_ROOT = Join-Path $env:RUNNER_TEMP "seqqc-runtime-$env:GITHUB_RUN_ID"
          $env:SEQQC_QA_SCENE = 'inputs'
          Remove-Item Env:SEQQC_QA_SCREENSHOT -ErrorAction SilentlyContinue
          if ($IsWindows) {
            & ./tools/observe-no-network-windows.ps1 -Executable ./target/release/seqqc-native-desktop.exe -Seconds 10
          } elseif ($IsMacOS) {
            bash ./tools/observe-no-network-macos.sh ./target/release/seqqc-native-desktop
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            xvfb-run -a bash ./tools/observe-no-network-linux.sh ./target/release/seqqc-native-desktop
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Retain synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-qualification-${{ matrix.os }}
          path: target/qualification/visual
          if-no-files-found: warn
          retention-days: 14
