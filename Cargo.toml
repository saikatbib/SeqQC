[workspace]
members = [
  "apps/native-desktop",
  "apps/desktop/src-tauri",
  "crates/seqqc-contracts",
  "crates/seqqc-discovery",
  "crates/seqqc-engine",
  "crates/seqqc-execution",
  "crates/seqqc-formats",
  "crates/seqqc-reporting",
  "crates/seqqc-security",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/saikatbib/SeqQC"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
